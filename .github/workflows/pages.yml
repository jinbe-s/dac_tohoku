name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: 'pages'
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NUXT_PUBLIC_SITE_NAME: ${{ vars.NUXT_PUBLIC_SITE_NAME || 'DAC東北' }}
      NUXT_PUBLIC_SITE_DESCRIPTION: ${{ vars.NUXT_PUBLIC_SITE_DESCRIPTION || '宮城県仙台市で開催する、D20システムを楽しむTRPGコンベンション' }}
      NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL || 'https://dac-tohoku.com' }}
      NUXT_PUBLIC_BASE: ${{ vars.NUXT_PUBLIC_BASE || '/' }}
      NUXT_PUBLIC_INDEXABLE: ${{ vars.NUXT_PUBLIC_INDEXABLE || 'false' }}
      NUXT_API_NEW_INFO: ${{ vars.NUXT_API_NEW_INFO }}
      NUXT_API_SESSION_LIST: ${{ vars.NUXT_API_SESSION_LIST }}
      NUXT_API_SESSION_LIST_2: ${{ vars.NUXT_API_SESSION_LIST_2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'yarn' }
      - run: yarn install --frozen-lockfile
      - run: npx nuxi generate
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./dist }

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
